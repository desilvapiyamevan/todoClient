
<div class="todoClient">
  <h2 class="title">To-Do List</h2>

  <form class="client-form" (ngSubmit)="addTodo()">
    <input type="text" placeholder="Your to do Item?" aria-label="to-do title" [ngModel]="toDoTitle()"
      (ngModelChange)="toDoTitle.set($event)" name="title" />
    <br />
    <br />
    <br />
    <br />
    <input type="textArea" placeholder="Description of the item?" aria-label="Description of the item"
      [ngModel]="toDoDescription()" (ngModelChange)="toDoDescription.set($event)" name="title" />
    <button type="submit" [disabled]="!toDoTitle().trim() || !toDoDescription().trim()">Add</button>
  </form>
  <p class="client-error" role="alert" *ngIf="error() as message">{{ message }}</p>

  <ng-container *ngIf="loading(); else notLoading">
    <p class="client-status">Loading…</p>
  </ng-container>

  <ng-template #notLoading>
    <ng-container *ngIf="todos().length === 0; else list">
      <p class="client-status">Nothing here yet — add your first item above.</p>
    </ng-container>

    <ng-template #list>
      <ul class="client-list">
        <li class="client-item" *ngFor="let todo of todos(); trackBy: trackById">
          <span>{{ todo.title }}</span>
          <button type="button" class="todo-client__delete" (click)="deleteTodo(todo.toDoItemId)"
            [attr.aria-label]="'Delete ' + todo.title">
            Delete
          </button>
        </li>
      </ul>
    </ng-template>
  </ng-template>

</div>
